[workspace]
resolver = "2"
members = [
    "crates/sherd-protocol",
    "crates/sherd-platform",
    "crates/sherd-platform-windows",
    "crates/sherd-platform-linux",
    "crates/sherd-core",
    "crates/sherd-daemon",
    "crates/sherd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
sherd-protocol = { path = "crates/sherd-protocol" }
sherd-platform = { path = "crates/sherd-platform" }
sherd-platform-windows = { path = "crates/sherd-platform-windows" }
sherd-platform-linux = { path = "crates/sherd-platform-linux" }
sherd-core = { path = "crates/sherd-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
interprocess = { version = "2", features = ["tokio"] }
rusqlite = { version = "0.32", features = ["bundled"] }
