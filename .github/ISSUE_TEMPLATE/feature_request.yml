name: Feature request
description: Suggest an idea or improvement for Sherd
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Sherd. Describing the problem first — before
        the solution — makes it much easier to evaluate.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - mesh / mempool / wire (P2P layer)
        - network daemon / CLI / IPC
        - platform-windows backend
        - platform-linux backend
        - desktop client
        - build / tooling / CI
        - not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you ruled them out.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, or anything else relevant.
    validations:
      required: false
