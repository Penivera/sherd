[package]
name = "sherd-vm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sherd VM integration core — Solari Linux + Windows providers, file injection, streaming, and IPC bridge"

[[bin]]
name = "sherd-vm"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
interprocess.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
base64.workspace = true
futures.workspace = true
solari-desktop-rs = { path = "../solari-desktop-rs" }
sherd-protocol = { path = "../../../network/crates/sherd-protocol" }
sherd-platform = { path = "../../../network/crates/sherd-platform" }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
