[workspace]
resolver = "2"
members = [
    "desktop",
    "wire",
    "mesh",
    "mempool",
    "network/crates/protocol",
    "network/crates/platform",
    "network/crates/platform-windows",
    "network/crates/platform-linux",
    "network/crates/engine",
    "network/crates/daemon",
    "network/crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
wire = { path = "wire" }
mesh = { path = "mesh" }
mempool = { path = "mempool" }
protocol = { path = "network/crates/protocol" }
platform = { path = "network/crates/platform" }
platform-windows = { path = "network/crates/platform-windows" }
platform-linux = { path = "network/crates/platform-linux" }
engine = { path = "network/crates/engine" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs", "signal"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
interprocess = { version = "2", features = ["tokio"] }
widestring = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
bytes = "1"
base64 = "0.22"
